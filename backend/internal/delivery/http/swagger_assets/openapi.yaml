openapi: 3.0.3
info:
  title: TikTok Coin Manager API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/transactions:
    get:
      summary: Get transactions
      responses:
        "200":
          description: Transactions retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"
    post:
      summary: Create transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
            example:
              title: Top up TikTok Coins
              transaction_type: CREDIT
              coin_amount: 1000
              topup_expense: 150000
              currency: IDR
              note: Top up note
              transaction_date: "2026-09-16T09:00:00Z"
      responses:
        "201":
          description: Transaction created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "422":
          description: Invalid transaction data
  /api/v1/transactions/{id}:
    get:
      summary: Get transaction detail
      parameters:
        - $ref: "#/components/parameters/TransactionID"
      responses:
        "200":
          description: Transaction retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "404":
          description: Transaction not found
    put:
      summary: Update transaction
      parameters:
        - $ref: "#/components/parameters/TransactionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
      responses:
        "200":
          description: Transaction updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "404":
          description: Transaction not found
        "422":
          description: Invalid transaction data
    delete:
      summary: Delete transaction
      parameters:
        - $ref: "#/components/parameters/TransactionID"
      responses:
        "200":
          description: Transaction deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "404":
          description: Transaction not found
  /api/v1/dashboard/summary:
    get:
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummaryResponse"
components:
  parameters:
    TransactionID:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        errors:
          type: array
          items:
            type: string
    TransactionRequest:
      type: object
      required:
        - transaction_type
        - coin_amount
        - transaction_date
      properties:
        title:
          type: string
        transaction_type:
          type: string
          enum: [CREDIT, DEBIT]
        coin_amount:
          type: integer
          minimum: 1
        topup_expense:
          type: integer
          minimum: 0
          nullable: true
        currency:
          type: string
          default: IDR
        note:
          type: string
        transaction_date:
          type: string
          format: date-time
    Transaction:
      allOf:
        - $ref: "#/components/schemas/TransactionRequest"
        - type: object
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    TransactionResponse:
      allOf:
        - $ref: "#/components/schemas/StandardResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Transaction"
    TransactionListResponse:
      allOf:
        - $ref: "#/components/schemas/StandardResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Transaction"
    DashboardSummary:
      type: object
      properties:
        coin_balance:
          type: integer
          example: 7500
        total_credit:
          type: integer
          example: 10000
        total_debit:
          type: integer
          example: 2500
        total_topup_expense:
          type: integer
          example: 1500000
    DashboardSummaryResponse:
      allOf:
        - $ref: "#/components/schemas/StandardResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/DashboardSummary"

